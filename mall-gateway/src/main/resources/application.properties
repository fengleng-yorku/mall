spring.application.name=mall-gateway
server.port=88

spring.cloud.gateway.mvc.routes[0].id=product_route
spring.cloud.gateway.mvc.routes[0].uri=lb://mall-product
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/product/**
spring.cloud.gateway.mvc.routes[0].filters[0]=RewritePath=/api/(?<segment>.*),/$\{segment}

spring.cloud.gateway.mvc.routes[1].id=third_party_route
spring.cloud.gateway.mvc.routes[1].uri=lb://mall-third-party
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/third-party/**
spring.cloud.gateway.mvc.routes[1].filters[0]=RewritePath=/api/third-party/(?<segment>.*),/$\{segment}

spring.cloud.gateway.mvc.routes[2].id=admin_route
spring.cloud.gateway.mvc.routes[2].uri=lb://renren-fast
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/**
spring.cloud.gateway.mvc.routes[2].filters[0]=RewritePath=/api/(?<segment>.*),/renren-fast/$\{segment}